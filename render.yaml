services:
  - type: web
    name: propertree-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn propertree.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: propertree.settings
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRIVATE_STORAGE_BUCKET
        sync: false
      - key: PRIVATE_STORAGE_ENDPOINT_URL
        sync: false
      - key: PRIVATE_STORAGE_REGION
        sync: false
      - key: PRIVATE_STORAGE_SIGNED_URL_TTL
        value: 900

  - type: web
    name: propertree-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

